<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入確認画面</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/purchaseConfirm.css}">
</head>
<body>

	<div th:replace="~{common/header :: header}"></div>
	
	<h1>購入確認画面</h1>
	
	<main class="purchase-detail-page">
	
		<!-- 名前 -->
		<div class="row">
		
		    名前：
		    <span th:text="${name}"></span>
		
		</div>
		
		
		<!-- 住所 -->
		<div class="row">
		
		    住所：
		    <span th:text="${address}"></span>
		
		</div>
		
		
		<!-- アパート名 -->
		<div class="row">
		
		    アパート名：
		    <span th:text="${apartment}"></span>
		
		</div>
		
		
		<!-- ============================== -->
		<!-- 単品購入 -->
		<!-- ============================== -->
		
		<div th:if="${product != null}">
		
		    <div class="row">
		
		        商品名：
		        <span th:text="${product.productName}"></span>
		
		    </div>
		
		    <div class="row">
		
		        個数：
		        <span th:text="${quantity}"></span>
		
		    </div>
		
		    <div class="row">
		
		        合計金額：
		        <span th:text="${product.includeTax * quantity}"></span>
		        円
		
		    </div>
		
		</div>
		
		
		<!-- ============================== -->
		<!-- カート購入 -->
		<!-- ============================== -->
		
		<div th:if="${cartList != null}">
		
		    <div
		        class="row"
		        th:each="cart : ${cartList}">
		
		        <span th:text="${cart.product.productName}"></span>
		        ×
		        <span th:text="${cart.quantity}"></span>
		        個
		
		        ：
		        <span
		            th:text="${cart.product.includeTax * cart.quantity}">
		        </span>
		        円
		
		    </div>
		
		    <div class="row">
		
		        合計金額：
		        <span th:text="${totalAmount}"></span>
		        円
		
		    </div>
		
		</div>
		
		
		<!-- ボタン -->
		<div class="button-area">
		
			<!-- 単品購入の編集 -->
			<form
			    th:if="${product != null}"
			    th:action="@{/purchase/{id}(id=${product.productId})}"
			    method="get"
			    style="display: inline;">
			
			    <input
			        type="hidden"
			        name="quantity"
			        th:value="${quantity}">
			
			    <button
			        type="submit"
			        class="back-button">
			
			        編集
			
			    </button>
			
			</form>
			
			
			<!-- カート購入の編集 -->
			<form
			    th:if="${cartList != null}"
			    th:action="@{/purchase/cart}"
			    method="get"
			    style="display: inline;">
			
			    <button
			        type="submit"
			        class="back-button">
			
			        編集
			
			    </button>
			
			</form>
			
			
			<!-- 単品購入 -->
			<form
			    th:if="${product != null}"
			    th:action="@{/purchase/complete}"
			    method="post"
			    style="display: inline;">
			
			    <input
			        type="hidden"
			        name="productId"
			        th:value="${product.productId}">
			
			    <input
			        type="hidden"
			        name="quantity"
			        th:value="${quantity}">
			
			    <input
			        type="hidden"
			        name="deliveryAddress"
			        th:value="${deliveryAddress}">
			
			    <input
			        type="hidden"
			        name="paymentMethod"
			        th:value="${paymentMethod}">
			
			    <button
			        type="submit"
			        class="confirm-button">
			
			        購入
			
			    </button>
			
			</form>
			
			
			<!-- カート購入 -->
			<form
			    th:if="${cartList != null}"
			    th:action="@{/purchase/cart/complete}"
			    method="post"
			    style="display: inline;">
			
			    <input
			        type="hidden"
			        name="deliveryAddress"
			        th:value="${deliveryAddress}">
			
			    <input
			        type="hidden"
			        name="paymentMethod"
			        th:value="${paymentMethod}">
			
			    <button
			        type="submit"
			        class="confirm-button">
			
			        購入
			
			    </button>
			
			</form>
		
		
		</div>
	</main>
	
	<div th:replace="~{common/footer :: footer}"></div>

</body>

</html>
