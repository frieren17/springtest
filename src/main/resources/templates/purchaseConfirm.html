<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>購入確認画面</title>

    <style>

        body {
            margin: 0;
            padding: 20px 35px 80px 35px;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 50px;
        }

        .row {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .button-area {
            margin-top: 50px;
        }

        .confirm-button {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .back-button {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            margin-right: 90px;
        }

    </style>

</head>


<body>

<div th:replace="~{common/header :: header}"></div>


<h1>購入確認画面</h1>


<!-- 名前 -->
<div class="row">

    名前：
    <span th:text="${name}"></span>

</div>


<!-- 住所 -->
<div class="row">

    住所：
    <span th:text="${address}"></span>

</div>


<!-- アパート名 -->
<div class="row">

    アパート名：
    <span th:text="${apartment}"></span>

</div>


<!-- 商品名 -->
<!--<div class="row">-->

<!--    商品名：-->
<!--    <span th:text="${product.productName}"></span>-->

<!--</div>-->


<!-- 個数 -->
<!--<div class="row">-->

<!--    個数：-->
<!--    <span th:text="${quantity}"></span>-->

<!--</div>-->


<!-- 合計金額 -->
<!--<div class="row">-->

<!--    合計金額：-->
<!--    <span th:text="${product.includeTax * quantity}"></span>-->
<!--    円-->

<!--</div>-->

<!-- ============================== -->
<!-- 単品購入 -->
<!-- ============================== -->

<div th:if="${product != null}">

    <div class="row">

        商品名：
        <span th:text="${product.productName}"></span>

    </div>

    <div class="row">

        個数：
        <span th:text="${quantity}"></span>

    </div>

    <div class="row">

        合計金額：
        <span th:text="${product.includeTax * quantity}"></span>
        円

    </div>

</div>


<!-- ============================== -->
<!-- カート購入 -->
<!-- ============================== -->

<div th:if="${cartList != null}">

    <div
        class="row"
        th:each="cart : ${cartList}">

        <span th:text="${cart.product.productName}"></span>
        ×
        <span th:text="${cart.quantity}"></span>
        個

        ：
        <span
            th:text="${cart.product.includeTax * cart.quantity}">
        </span>
        円

    </div>

    <div class="row">

        合計金額：
        <span th:text="${totalAmount}"></span>
        円

    </div>

</div>



<!-- ボタン -->
<div class="button-area">


    <!-- 編集ボタン -->
<!--    <form-->

<!--        method="get"-->
<!--        style="display: inline;">-->

<!--            th:value="${quantity}">-->

<!--        <button-->
<!--            type="submit"-->
<!--            class="back-button">-->

<!--            編集-->

<!--        </button>-->

<!--    </form>-->
<!-- 単品購入の編集 -->
<form
    th:if="${product != null}"
    th:action="@{/purchase/{id}(id=${product.productId})}"
    method="get"
    style="display: inline;">

    <input
        type="hidden"
        name="quantity"
        th:value="${quantity}">

    <button
        type="submit"
        class="back-button">

        編集

    </button>

</form>


<!-- カート購入の編集 -->
<form
    th:if="${cartList != null}"
    th:action="@{/purchase/cart}"
    method="get"
    style="display: inline;">

    <button
        type="submit"
        class="back-button">

        編集

    </button>

</form>



    <!-- 購入ボタン -->
<!--    <form-->
<!--        th:action="@{/purchase/complete}"-->
<!--        method="post"-->
<!--        style="display: inline;">-->

<!--        <input-->
<!--            type="hidden"-->
<!--            name="productId"-->
<!--            th:value="${product.productId}">-->

<!--        <input-->
<!--            type="hidden"-->
<!--            name="quantity"-->
<!--            th:value="${quantity}">-->

<!--        <input-->
<!--            type="hidden"-->
<!--            name="deliveryAddress"-->
<!--            th:value="${deliveryAddress}">-->

<!--        <input-->
<!--            type="hidden"-->
<!--            name="paymentMethod"-->
<!--            th:value="${paymentMethod}">-->

<!--        <button-->
<!--            type="submit"-->
<!--            class="confirm-button">-->

<!--            購入-->

<!--        </button>-->

<!--    </form>-->
<!-- 単品購入 -->
<form
    th:if="${product != null}"
    th:action="@{/purchase/complete}"
    method="post"
    style="display: inline;">

    <input
        type="hidden"
        name="productId"
        th:value="${product.productId}">

    <input
        type="hidden"
        name="quantity"
        th:value="${quantity}">

    <input
        type="hidden"
        name="deliveryAddress"
        th:value="${deliveryAddress}">

    <input
        type="hidden"
        name="paymentMethod"
        th:value="${paymentMethod}">

    <button
        type="submit"
        class="confirm-button">

        購入

    </button>

</form>


<!-- カート購入 -->
<form
    th:if="${cartList != null}"
    th:action="@{/purchase/cart/complete}"
    method="post"
    style="display: inline;">

    <input
        type="hidden"
        name="deliveryAddress"
        th:value="${deliveryAddress}">

    <input
        type="hidden"
        name="paymentMethod"
        th:value="${paymentMethod}">

    <button
        type="submit"
        class="confirm-button">

        購入

    </button>

</form>



</div>


<div th:replace="~{common/footer :: footer}"></div>


</body>

</html>
