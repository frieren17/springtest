<!-- 単品購入 -->
<div th:if="${product != null}" class="purchase-info">

    <div class="info-row">
        <img
            th:src="@{${product.imgPath}}"
            alt="商品画像"
            width="200">
    </div>

    <div class="info-row">
        商品名：
        <span th:text="${product.productName}"></span>
    </div>

    <div class="info-row">
        数量：
        <span th:text="${quantity}"></span>
    </div>

    <div class="info-row">
        税込価格：
        <span
            th:text="${#numbers.formatInteger(totalAmount, 3, 'COMMA')}">
        </span>
        円
    </div>
	
	<div class="info-row">
        住所：
        <span th:text="${completeAddress}"></span>
    </div>

</div>


<!-- カート購入 -->
<div th:if="${cartList != null}" class="purchase-info">

    <div th:each="cart : ${cartList}">

        <hr>

        <div class="info-row">
            <img
                th:src="@{${cart.product.imgPath}}"
                alt="商品画像"
                width="200">
        </div>

        <div class="info-row">
            商品名：
            <span th:text="${cart.product.productName}"></span>
        </div>

        <div class="info-row">
            数量：
            <span th:text="${cart.quantity}"></span>
        </div>

        <div class="info-row">
            税込価格：
            <span
                th:text="${cart.product.includeTax * cart.quantity}">
            </span>
            円
        </div>
		
		<div class="info-row">
	        住所：
	        <span th:text="${completeAddress}"></span>
	    </div>

    </div>

    <hr>

    

</div>
