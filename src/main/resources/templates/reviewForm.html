<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>口コミ投稿画面</title>
<!-- 共通CSS -->
<link rel="stylesheet" th:href="@{/css/common.css}">

<!-- 口コミ投稿画面専用CSS -->
<link rel="stylesheet" th:href="@{/css/review.css}">
</head>
<body>
	
	
	<div th:replace="~{common/header :: header}"></div>
	<h1>口コミ投稿画面</h1>
	<body class="review-page">

	<form class="review-form"
		  th:action="@{/review/add}"
	      method="post"
	      enctype="multipart/form-data">

	    <!-- 商品ID -->
	    <input type="hidden"
	           name="productId"
	           th:value="${productId}">

	    <div class="form-row">
	        <label for="dummyUserName">ユーザー名（任意）</label>
	        <input type="text" id="dummyUserName" name="dummyUserName">
	    </div>

	    <div class="form-row">
	        <label for="rating">評価</label>
	        <select id="rating" class="rating-select"name="rating">
	            <option value="1">1</option>
	            <option value="2">2</option>
	            <option value="3">3</option>
	            <option value="4">4</option>
	            <option value="5">5</option>
	        </select>
	    </div>

	    <div class="form-row">
	        <label for="contactEmail">メールアドレス</label>
	        <input type="email" id="contactEmail" name="contactEmail">
	    </div>

	    <div class="form-row">
	        <label for="comment">コメント</label>
	        <textarea  id="comment" name="comment"></textarea>
	    </div>

	    <div class="file-row">
	        <label class="imageFile">画像</label>
	        <input type="file" name="imageFile">
	    </div>

		<div class="button-area">
		    <button type="submit" class="submit-button">
		        投稿
		    </button>
		</div>
	</form>
	
	<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
