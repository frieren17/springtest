<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>カート内詳細画面</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/checkoutDetail.css}">
</head>
<body>
	<div th:replace="~{common/header :: header}"></div>

	<h1>カート詳細画面</h1>

	<main class="cart-detail-page">

		<!-- =====================================
		     カートが空の場合
		     ===================================== -->
		<div th:if="${#lists.isEmpty(cartList)}" class="empty-cart">
	
		    <p>カートに商品がありません。</p>
	
		    <!-- TOPへ戻る -->
		    <form th:action="@{/}" method="get">
	
		        <button type="submit">
		            TOP画面に戻る
		        </button>
	
		    </form>
	
		</div>


		<!-- =====================================
		     カートに商品がある場合
		     ===================================== -->
		<div th:unless="${#lists.isEmpty(cartList)}" class="cart-detail-container">
	
			<div class="cart-products">
				
			    <!-- 商品一覧 -->
			    <div class="cart-product" th:each="cart : ${cartList}">
		
		
			        <!-- 商品画像 -->
			        <div class="cart-product-image">
		
			            <img
			                th:src="@{${cart.product.imgPath}}"
			                alt="商品画像"
			                width="150">
		
			        </div>
		
					<div class="cart-product-info">
						
				        <!-- 商品名 -->
				        <div class="product-name">
			
				            商品名：
			
				            <span
				                th:text="${cart.product.productName}">
				            </span>
			
				        </div>
		
		
				        <!-- =================================
				             数量変更
				             ================================= -->
				        <div class="quantity-area">
			
				            <form
				                th:action="@{/cart/update}"
				                method="post">
			
				                <!-- CSRF対策 -->
				                <input
				                    type="hidden"
				                    th:name="${_csrf.parameterName}"
				                    th:value="${_csrf.token}">
			
				                <!-- カートID -->
				                <input
				                    type="hidden"
				                    name="cartId"
				                    th:value="${cart.cartId}">
			
			
				                <label>
				                    数量：
				                </label>
			
			
				                <!-- 数量プルダウン -->
				                <select name="quantity" onchange="this.form.submit()">
			
				                    <option
				                        th:each="num : ${#numbers.sequence(1, cart.product.stock)}"
				                        th:value="${num}"
				                        th:text="${num}"
				                        th:selected="${num == cart.quantity}">
				                    </option>
			
				                </select>
			
			
				                <button type="submit" class="quantity-update-button">
				                    数量を変更
				                </button>
			
				            </form>
			
				        </div>
			
			
				        <!-- =================================
				             削除
				             ================================= -->
				        <div class="delete-area">
			
				            <form
				                th:action="@{/cart/delete}"
				                method="post">
			
				                <!-- CSRF対策 -->
				                <input
				                    type="hidden"
				                    th:name="${_csrf.parameterName}"
				                    th:value="${_csrf.token}">
			
				                <!-- カートID -->
				                <input
				                    type="hidden"
				                    name="cartId"
				                    th:value="${cart.cartId}">
			
			
				                <button type="submit" class="delete-button">
				                    削除
				                </button>
			
				            </form>
			
				        </div>
		
				
						<!-- =================================
				             税抜き金額
				             ================================= -->
				        <div class="product-price">
				
				            価格：
				
				            <span
				                th:text="${cart.product.price * cart.quantity}">
				            </span>
				
				            円
				
				        </div>
		
		
				        <!-- =================================
				             税込み金額
				             ================================= -->
				        <div class="product-tax-price">
				
				            消費税込み金額：
				
				            <span
				                th:text="${cart.product.includeTax * cart.quantity}">
				            </span>
				
				            円
				
				       </div>
					
				</div>
			</div>
		</div>
			
		<!-- =====================================
		         カート合計
		         ===================================== -->
	
		<aside class="cart-summary">
				
		    <div class="summary-row">
	
		        個数：
	
		        <span
		            th:text="${totalQuantity}">
		        </span>
	
		        個
	
		    </div>
	
	
		    <div class="summary-row">
	
		        金額：
	
		        <span
		            th:text="${totalPrice}">
		        </span>
	
		        円
	
		    </div>
	
	
		    <div class="summary-row">
	
		        税込み合計：
	
		        <span
		            th:text="${totalIncludeTax}">
		        </span>
	
		        円
	
		    </div>
	
	
		    <!-- =====================================
		         レジに進む
		         ===================================== -->
	
		    <form
		        th:action="@{/purchase/cart}"
		        method="get">
	
		        <button type="submit" class="checkout-button">
		            レジに進む
		        </button>
	
		    </form>
	
		</aside>
	
	</main>

	<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
