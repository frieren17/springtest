<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>カート内詳細画面</title>

</head>
<body>
	<div th:replace="~{common/header :: header}"></div>

	<h1>カート詳細画面</h1>


	<!-- =====================================
	     カートが空の場合
	     ===================================== -->
	<div th:if="${#lists.isEmpty(cartList)}">

	    <p>カートに商品がありません。</p>

	    <!-- TOPへ戻る -->
	    <form th:action="@{/}" method="get">

	        <button type="submit">
	            TOP画面に戻る
	        </button>

	    </form>

	</div>


	<!-- =====================================
	     カートに商品がある場合
	     ===================================== -->
	<div th:unless="${#lists.isEmpty(cartList)}">


	    <!-- 商品一覧 -->
	    <div th:each="cart : ${cartList}">

	        <hr>


	        <!-- 商品画像 -->
	        <div>

	            <img
	                th:src="@{${cart.product.imgPath}}"
	                alt="商品画像"
	                width="150">

	        </div>


	        <!-- 商品名 -->
	        <div>

	            商品名：

	            <span
	                th:text="${cart.product.productName}">
	            </span>

	        </div>


	        <!-- =================================
	             数量変更
	             ================================= -->
	        <div>

	            <form
	                th:action="@{/cart/update}"
	                method="post">

	                <!-- CSRF対策 -->
	                <input
	                    type="hidden"
	                    th:name="${_csrf.parameterName}"
	                    th:value="${_csrf.token}">

	                <!-- カートID -->
	                <input
	                    type="hidden"
	                    name="cartId"
	                    th:value="${cart.cartId}">


	                <label>
	                    数量：
	                </label>


	                <!-- 数量プルダウン -->
	                <select name="quantity">

	                    <option
	                        th:each="num : ${#numbers.sequence(1, cart.product.stock)}"
	                        th:value="${num}"
	                        th:text="${num}"
	                        th:selected="${num == cart.quantity}">
	                    </option>

	                </select>


	                <button type="submit">
	                    数量を変更
	                </button>

	            </form>

	        </div>


	        <!-- =================================
	             税抜き金額
	             ================================= -->
	        <div>

	            価格：

	            <span
	                th:text="${cart.product.price * cart.quantity}">
	            </span>

	            円

	        </div>


	        <!-- =================================
	             税込み金額
	             ================================= -->
	        <div>

	            消費税込み金額：

	            <span
	                th:text="${cart.product.includeTax * cart.quantity}">
	            </span>

	            円

	        </div>


	        <!-- =================================
	             削除
	             ================================= -->
	        <div>

	            <form
	                th:action="@{/cart/delete}"
	                method="post">

	                <!-- CSRF対策 -->
	                <input
	                    type="hidden"
	                    th:name="${_csrf.parameterName}"
	                    th:value="${_csrf.token}">

	                <!-- カートID -->
	                <input
	                    type="hidden"
	                    name="cartId"
	                    th:value="${cart.cartId}">


	                <button type="submit">
	                    削除
	                </button>

	            </form>

	        </div>

	    </div>
		
		
		
		<!-- =====================================
		         カート合計
		         ===================================== -->

		    <hr>

		    <div>

		        個数：

		        <span
		            th:text="${totalQuantity}">
		        </span>

		        個

		    </div>


		    <div>

		        金額：

		        <span
		            th:text="${totalPrice}">
		        </span>

		        円

		    </div>


		    <div>

		        税込み合計：

		        <span
		            th:text="${totalIncludeTax}">
		        </span>

		        円

		    </div>


		    <!-- =====================================
		         レジに進む
		         ===================================== -->

		    <form
		        th:action="@{/purchase/cart}"
		        method="get">

		        <button type="submit">
		            レジに進む
		        </button>

		    </form>


	    <hr>

	    <!-- TOPへ戻る -->
	    <form th:action="@{/}" method="get">

	        <button type="submit">
	            TOP画面に戻る
	        </button>

	    </form>

	</div>


	<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
